version: 1
extends:
  - content/authors.yml
project:
  title: "Deep Learning for EEG Analysis, 2019-2026: A Critical Review Since Roy et al. (2019)"
  subtitle: A Reproducible Computational Review
  description: >
    An AI-assisted critical review of deep learning for electroencephalography (EEG)
    since the Roy et al. (2019) systematic review: datasets and evaluation practice,
    architectures, self-supervised and foundation models, clinical and BCI
    applications, generalisation, interpretability and reproducibility.
  keywords:
    - EEG
    - deep learning
    - brain-computer interfaces
    - foundation models
    - critical review
    - reproducible research
  license: MIT
  open_access: true
  numbering:
    figure:
      continue: true
    table:
      continue: true
    equation:
      continue: true
    code:
      continue: true
  plugins:
    - https://github.com/AllenNeuralDynamics/AuthorshipExtractor/releases/latest/download/authorship-plugin.mjs
    - plugins/evidence-explorer-plugin.mjs
    - plugins/figure-lightbox-plugin.mjs
  github: https://github.com/m9h/ComputationalReviewDLEEG
  bibliography:
    - content/references.bib
  toc:
    - file: content/00_frontmatter.md
    - file: content/01_introduction.md
    - file: content/Methods.md
      title: Methods
    - file: content/evidence_database.md
      title: Evidence Database
    - file: content/provenance.md
      title: Pipeline Provenance
  exports:
    - format: tex
      output: review_manuscript.tex
      template: ./latex/template
    - format: pdf
      output: review_manuscript.pdf
      template: ./latex/template
site:
  template: book-theme
  title: "Deep Learning for EEG: A Computational Review"
  nav:
    - title: GitHub
      url: https://github.com/m9h/ComputationalReviewDLEEG
